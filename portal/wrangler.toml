name = "hoops-portal"
routes = [
  { pattern = "portal.adamforb.es", custom_domain = true },
  # Team stat tracker on the Lions Den domain, so it opens inside the pinned Lions Den app on iPhone
  # (same site = no Safari bars). Everything else on lions.adamforb.es still goes to GitHub Pages.
  # Needs lions.adamforb.es proxied (orange cloud) in Cloudflare DNS, SSL mode Full for that host.
  # To undo: delete these four lines and deploy.
  { pattern = "lions.adamforb.es/track*", zone_name = "adamforb.es" },
  { pattern = "lions.adamforb.es/api/tracker/*", zone_name = "adamforb.es" },
  { pattern = "lions.adamforb.es/api/public/*", zone_name = "adamforb.es" },
  { pattern = "lions.adamforb.es/qrcode.js", zone_name = "adamforb.es" },
]
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = false

# The portal's own pages (login, sponsors, branding) are served from public/.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/files/*"]

[[d1_databases]]
binding = "DB"
database_name = "hoops-portal"
database_id = "4dcd6eac-d259-4724-b695-f2c5713f59dc"

[[r2_buckets]]
binding = "FILES"
bucket_name = "hoops-portal-files"

[vars]
# Sites allowed to call the public API and send sponsor counts.
SITE_ORIGINS = "https://hoops.adamforb.es,https://lions.adamforb.es,https://panthers.adamforb.es,http://localhost:8811"
SITE_URL = "https://hoops.adamforb.es"
# Clubs that get the team stat tracker while it is being tested ("*" = every Plus club).
TRACKER_CLUBS = "lions"
# ADMIN_SETUP_TOKEN is a secret: wrangler secret put ADMIN_SETUP_TOKEN
